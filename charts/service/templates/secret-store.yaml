{{- if .Values.secrets }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-secrets
  labels:
    {{- include "platform-service.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "secretStore.roleARN is required when secrets are configured" .Values.secretStore.roleARN | quote }}
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: service-secrets
  labels:
    {{- include "platform-service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "secretStore.region is required when secrets are configured" .Values.secretStore.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: service-secrets
{{- end }}
