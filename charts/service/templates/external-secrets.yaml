{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.service.name }}-{{ .environmentVariable | lower | replace "_" "-" }}
  labels:
    {{- include "platform-service.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: service-secrets
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: {{ .key | quote }}
{{- end }}
