apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "platform-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "platform-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.deployment.port }}
      targetPort: http
      protocol: TCP
