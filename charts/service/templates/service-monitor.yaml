apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "platform-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "platform-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
