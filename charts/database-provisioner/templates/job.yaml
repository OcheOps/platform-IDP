apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "database-provisioner.name" . }}
  labels:
    app.kubernetes.io/name: database-provisioner
    app.kubernetes.io/part-of: platform-idp
    platform.idp/request-id: {{ .Values.request.id | quote }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 360
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-provisioner
        platform.idp/request-id: {{ .Values.request.id | quote }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provisioner
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
            - { name: AWS_REGION, value: {{ .Values.awsRegion | quote }} }
            - { name: REQUEST_ID, value: {{ .Values.request.id | quote }} }
            - { name: DATABASE_NAME, value: {{ .Values.database.name | quote }} }
            - { name: DATABASE_USER, value: {{ .Values.database.user | quote }} }
            - { name: DATABASE_HOST, value: {{ .Values.database.host | quote }} }
            - { name: DATABASE_PORT, value: {{ .Values.database.port | quote }} }
            - { name: MASTER_SECRET_NAME, value: {{ .Values.secrets.master | quote }} }
            - { name: PASSWORD_SECRET_NAME, value: {{ .Values.secrets.password | quote }} }
            - { name: SERVICE_SECRET_NAME, value: {{ .Values.secrets.service | quote }} }
          resources:
{{ toYaml .Values.resources | indent 12 }}
